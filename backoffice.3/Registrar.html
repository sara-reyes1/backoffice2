<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar - Backoffice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="titulo">Registro de usuario</h1>
  <form action="#" method="post" class="formulario">
    <label for="username">Nombre:</label>
    <input type="text" id="username" name="username" autocomplete="name" required>
    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
    <label for="itsonId">ID ITSON (6 dígitos):</label>
    <input type="text" id="itsonId" name="itsonId" maxlength="6" pattern="\d{6}" placeholder="Ej. 245123" required>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required>
    <button type="submit" class="boton">Registrarse</button>
    <a class="link" href="index.html">¿Ya tienes cuenta? Inicia sesión</a>
  </form>
  <script src="script.js"></script>
</body>
</html>
